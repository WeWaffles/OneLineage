name: xnu-build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "OneLineage build profile"
        type: choice
        default: qemu
        options:
          - qemu
          - phone
  push:
    paths:
      - "xnu/**"
      - "tools/xnu/**"
      - "tests/test_xnu_tools.py"
      - ".github/workflows/xnu-build.yml"

concurrency:
  group: xnu-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS 14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks).
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Offline tool tests
        run: python3 tests/test_xnu_tools.py -v

      - name: Dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists; Xcode is preinstalled and
          # the real xcodes would try to manage installations.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          # XNU-8796 needs Xcode 15.x: Xcode 16's iig emits IORPC.kernelContent
          # for an IORPC ABI this xnu does not have. Take the newest 15.x.
          XC="$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -z "$XC" ]]; then
            echo "::error::no Xcode 15.x on this image; XNU-8796 cannot be built with Xcode 16's iig"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Using $XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig
          xcrun --sdk macosx --find mig || echo "no SDK mig; build.sh builds one from bootstrap_cmds"

      - name: Preflight
        env:
          ONELINEAGE_XNU_PROFILE: ${{ inputs.profile || 'qemu' }}
        run: bash xnu/build_xnu.sh --check

      - name: Build the pinned kernel
        env:
          # keep going so one run reports every compile failure
          MAKEFLAGS: -k
          # qemu selects the PL011 bootstrap console; phone keeps the panel one.
          ONELINEAGE_XNU_PROFILE: ${{ inputs.profile || 'qemu' }}
        run: |
          # pipefail keeps the script's status through tee; without it the
          # pipeline would report tee's success and hide a failed build.
          set -o pipefail
          mkdir -p build/xnu-build
          bash xnu/build_xnu.sh 2>&1 | tee build/xnu-build/harness.log

      - name: Boot the kernel in QEMU
        # The kernel only exists here and on a Mac; artifact downloads need a
        # login, so the first boot happens on the runner that built it.
        env:
          # keep going so one run reports every compile failure
          MAKEFLAGS: -k
        run: |
          set -euo pipefail
          KERNEL="$(ls build/xnu/kernel.* | head -n 1)"
          echo "kernel: $KERNEL"

          xcrun --sdk macosx clang --target=aarch64-none-elf -c xnu/loader/loader.S \
            -o build/xnu/loader.o
          python3 tools/xnu/extract_elf.py build/xnu/loader.o \
            --output build/xnu/loader.bin --json build/xnu/loader.json \
            --max-size 0x10000 --require-symbol _start --require-symbol loader_params

          python3 tools/xnu/mk_m3q_adt.py kernel/device-hardware/sm-s948u-azf1.json \
            build/xnu/m3q.adt
          python3 tools/xnu/build_payload.py "$KERNEL" build/xnu/m3q.adt \
            build/xnu/m3q.payload --target qemu

          brew install qemu

          # Two boots per run: start.s may program EL2 registers, which traps
          # when the CPU was entered at EL1. Both are cheap, and the pair says
          # more than either alone.
          for MODE in el1 el2; do
            EL2=""
            [[ "$MODE" == "el2" ]] && EL2="--el2"
            python3 tools/xnu/qemu_run.py build/xnu/m3q.payload \
              --loader build/xnu/loader.bin --loader-symbols build/xnu/loader.json \
              --boot-plan "build/xnu/boot-plan-$MODE.json" \
              --console "file:build/xnu/console-$MODE.log" \
              --debug-log "build/xnu/trace-$MODE.log" \
              $EL2 --execute --timeout 20 || true

            echo "=== $MODE console ==="
            cat "build/xnu/console-$MODE.log" 2>/dev/null || echo "(no output)"
            # Annotations are readable without signing in; the job log is not.
            while IFS= read -r line; do
              printf '::notice title=%s console::%s\n' "$MODE" "${line//%/%%}"
            done < <(head -n 10 "build/xnu/console-$MODE.log" 2>/dev/null || true)

            echo "=== $MODE trace ==="
            grep -E "Taking exception|ELR|FAR|ESR|SPSR|from EL" "build/xnu/trace-$MODE.log" 2>/dev/null | head -n 12 || true
            while IFS= read -r line; do
              printf '::warning title=%s trace::%s\n' "$MODE" "${line//%/%%}"
            done < <(grep -E "Taking exception|ELR|FAR|ESR|SPSR" "build/xnu/trace-$MODE.log" 2>/dev/null | head -n 8 || true)
          done

          # A heredoc body would keep its indentation inside this YAML block
          # scalar, which Python reads as an IndentationError, so this stays a
          # one-liner.
          SUMMARY="$(python3 -c 'import json; p = json.load(open("build/xnu/boot-plan-el1.json")); print(" ".join(f"{k}={p[k]}" for k in ("segments", "kernel_phys", "payload_phys", "payload_size", "loader_addr", "boot_args_phys", "adt_phys", "top_of_kernel_data", "loader_entry_phys") if k in p))')"
          echo "--- boot plan ---"
          echo "$SUMMARY"
          printf '::notice title=boot plan::%s\n' "${SUMMARY//%/%%}"

      - name: Surface the failure
        if: failure()
        run: |
          # Annotations are readable on a public repository without signing in,
          # which is what makes a failed run diagnosable from outside the UI.
          for LOG in build/xnu-build/harness.log build/xnu-build/build.log; do
            if [[ -f "$LOG" ]]; then
              echo "--- $LOG (last error lines) ---"
              grep -nE "^error:|fatal error|error:|Error [0-9]|does not apply|not found|undefined symbol|No such file" "$LOG" \
                | tail -n 8 | while IFS= read -r line; do
                  printf '::error title=%s::%s\n' "$(basename "$LOG")" "${line//\%/%%}"
                done
              echo "--- $LOG (tail) ---"
              tail -n 25 "$LOG"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-${{ inputs.profile || 'qemu' }}
          path: |
            build/xnu/
            build/xnu-build/build.log
            build/xnu-build/harness.log
            build/xnu-build/series-report.json
          if-no-files-found: warn
          retention-days: 7
